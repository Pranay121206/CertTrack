<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CertTrack — FRCRCE ECS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#faf6f0;--warm:#f0e8db;--sand:#e2d5c3;
  --terra:#c8735a;--terra2:#b5614a;--rust:#8b3e2f;
  --forest:#2d4a3e;--forest2:#1e3329;--sage:#6b8f71;--sage2:#4a6b50;
  --charcoal:#1a1a1a;--graphite:#2c2c2c;--mist:#6b6b6b;--fog:#9b9b9b;
  --paper:#fdfaf6;--gold:#c8a45a;--gold2:#e8c57a;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--serif:'Fraunces',serif;
  --r:10px;--rl:16px;--rxl:24px;
  --shm:0 4px 24px rgba(26,26,26,.08),0 1px 4px rgba(26,26,26,.05);
  --shl:0 12px 48px rgba(26,26,26,.12),0 4px 12px rgba(26,26,26,.06);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--cream);color:var(--charcoal);min-height:100vh;font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* AUTH */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.al{background:var(--forest2);padding:3.5rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.al::before{content:'';position:absolute;top:-120px;right:-80px;width:380px;height:380px;border-radius:50%;background:rgba(200,115,90,.14);pointer-events:none}
.al::after{content:'';position:absolute;bottom:-100px;left:-60px;width:300px;height:300px;border-radius:50%;background:rgba(107,143,113,.1);pointer-events:none}
.ab{position:relative;z-index:1}
.alogo{display:inline-flex;align-items:center;gap:12px;margin-bottom:3rem}
.amark{width:44px;height:44px;background:var(--terra);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.altxt{font-size:.95rem;font-weight:700;color:#fff}.alsub{font-size:.65rem;color:rgba(255,255,255,.4);font-family:var(--mono);margin-top:2px}
.ahead{font-family:var(--serif);font-size:3.2rem;line-height:1.1;color:#fff;margin-bottom:1.5rem;font-weight:700}
.ahead em{color:var(--gold2);font-style:italic}
.adesc{font-size:.9rem;line-height:1.8;color:rgba(255,255,255,.55);max-width:380px;margin-bottom:2.5rem}
.afeats{display:flex;flex-direction:column;gap:16px}
.afeat{display:flex;align-items:flex-start;gap:14px}
.adot{width:8px;height:8px;border-radius:50%;background:var(--terra);margin-top:6px;flex-shrink:0}
.aft{font-size:.85rem;font-weight:600;color:#fff;margin-bottom:2px}
.afd{font-size:.75rem;color:rgba(255,255,255,.4);line-height:1.5}
.afooter{font-size:.72rem;color:rgba(255,255,255,.3);font-family:var(--mono)}
.ar{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:3rem}
.aform{width:100%;max-width:420px}
.aform h2{font-family:var(--serif);font-size:2rem;font-weight:700;margin-bottom:.4rem;letter-spacing:-.02em}
.aform .sub{font-size:.85rem;color:var(--mist);margin-bottom:1.5rem}
.tabs{display:flex;background:var(--warm);border-radius:var(--r);padding:4px;margin-bottom:1.5rem;gap:4px}
.tab{flex:1;padding:9px;border:none;border-radius:7px;font-family:var(--font);font-size:.83rem;font-weight:500;cursor:pointer;color:var(--mist);background:transparent;transition:all .22s var(--ease-out)}
.tab.on{background:#fff;color:var(--charcoal);box-shadow:0 2px 8px rgba(26,26,26,.1)}

/* FORMS */
.fl{display:flex;flex-direction:column;gap:14px}
.fg{display:flex;flex-direction:column;gap:6px}
.lb{font-size:.72rem;font-weight:600;color:var(--mist);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.inp,.sel{width:100%;padding:11px 14px;background:var(--warm);border:1.5px solid var(--sand);border-radius:var(--r);font-family:var(--font);font-size:.9rem;color:var(--charcoal);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;appearance:none;-webkit-appearance:none}
.inp:focus,.sel:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(200,115,90,.12);background:#fff}
.inp::placeholder{color:var(--fog)}
textarea.inp{resize:vertical;min-height:70px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border:none;border-radius:var(--r);font-family:var(--font);font-size:.88rem;font-weight:600;cursor:pointer;letter-spacing:-.01em;transition:transform .16s var(--ease-out),box-shadow .16s,background .16s,opacity .16s;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)!important}
.btn-dk{background:var(--charcoal);color:#fff}.btn-dk:hover{background:var(--graphite);transform:translateY(-1px)}
.btn-t{background:var(--terra);color:#fff}.btn-t:hover{background:var(--terra2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(200,115,90,.3)}
.btn-f{background:var(--forest);color:#fff}.btn-f:hover{background:var(--forest2);transform:translateY(-1px)}
.btn-g{background:transparent;color:var(--graphite);border:1.5px solid var(--sand)}.btn-g:hover{background:var(--warm)}
.btn-ok{background:#2d6a4f;color:#fff}.btn-ok:hover{background:#245a41;transform:translateY(-1px)}
.btn-err{background:#a4262c;color:#fff}.btn-err:hover{background:#8a1a20;transform:translateY(-1px)}
.btn-sm{padding:7px 14px;font-size:.8rem}.btn-xs{padding:5px 11px;font-size:.75rem}.btn-fw{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.dcreds{margin-top:1.2rem;padding:14px;background:var(--warm);border-radius:var(--r);border:1px solid var(--sand);font-family:var(--mono);font-size:.73rem;color:var(--mist);line-height:1.9;max-height:160px;overflow-y:auto}
.dcreds strong{color:var(--terra)}

/* APP LAYOUT */
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sb{background:#fff;border-right:1px solid var(--sand);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sbh{padding:1.2rem;border-bottom:1px solid var(--warm)}
.sblogo{display:flex;align-items:center;gap:10px}
.sbm{width:34px;height:34px;background:var(--terra);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.sbn{font-size:.85rem;font-weight:700}.sbs{font-size:.63rem;color:var(--fog);font-family:var(--mono);margin-top:1px}
.sbnav{flex:1;padding:.8rem .6rem}
.navlbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--fog);font-family:var(--mono);padding:0 8px;margin:14px 0 5px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);cursor:pointer;font-size:.84rem;color:var(--mist);position:relative;transition:background .15s,color .15s}
.ni:hover{background:var(--warm);color:var(--charcoal)}
.ni.on{background:var(--cream);color:var(--charcoal);font-weight:600}
.ni.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:55%;background:var(--terra);border-radius:0 3px 3px 0}
.ni-ic{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--terra);color:#fff;border-radius:20px;font-size:.62rem;padding:2px 7px;font-weight:700;font-family:var(--mono)}
.sbf{padding:.8rem .6rem;border-top:1px solid var(--warm)}
.urow{display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--r);cursor:pointer;transition:background .15s}
.urow:hover{background:var(--warm)}
.uav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--terra),var(--gold));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.unm{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.url{font-size:.65rem;color:var(--fog);font-family:var(--mono)}
.logbtn{background:none;border:none;color:var(--fog);cursor:pointer;padding:4px;border-radius:6px;transition:color .2s;flex-shrink:0;font-size:13px}
.logbtn:hover{color:#a4262c}

/* STATUS PILL */
.spill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:.68rem;font-weight:600;font-family:var(--mono);cursor:pointer;transition:opacity .2s;user-select:none}
.spill.online{background:rgba(45,106,79,.1);color:#1e5e3a;border:1px solid rgba(45,106,79,.2)}
.spill.offline{background:rgba(164,38,44,.08);color:#8a1a20;border:1px solid rgba(164,38,44,.15)}
.spill.checking{background:rgba(200,164,90,.1);color:#7a5e1a;border:1px solid rgba(200,164,90,.2)}
.spill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.spill.online .spill-dot{background:#2d6a4f;animation:pdot 2.5s ease infinite}
.spill.offline .spill-dot{background:#a4262c}
.spill.checking .spill-dot{background:var(--gold);animation:pdot 1s ease infinite}
@keyframes pdot{0%,100%{opacity:1}50%{opacity:.3}}

/* MAIN */
.main{overflow-y:auto;background:var(--cream)}
.ph{padding:1.3rem 2rem;border-bottom:1px solid var(--sand);background:rgba(250,246,240,.97);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.pt{font-size:1.2rem;font-weight:700;letter-spacing:-.02em;font-family:var(--serif)}
.ps{font-size:.75rem;color:var(--mist);margin-top:2px;font-family:var(--mono)}
.pa{display:flex;align-items:center;gap:8px}
.pb{padding:2rem}

/* PAGE ANIM */
.page-enter{animation:pgIn .28s var(--ease-out) both}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* CARDS */
.card{background:#fff;border:1px solid var(--sand);border-radius:var(--rl);box-shadow:var(--shm);overflow:hidden}
.ch{padding:1.1rem 1.4rem;border-bottom:1px solid var(--warm);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ct{font-size:.88rem;font-weight:700;letter-spacing:-.01em}
.cb{padding:1.4rem}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.sc{background:#fff;border:1px solid var(--sand);border-radius:var(--rl);padding:1.3rem;position:relative;overflow:hidden;transition:transform .22s var(--ease-out),box-shadow .22s;cursor:default}
.sc:hover{transform:translateY(-3px);box-shadow:var(--shl)}
.sc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;transform:scaleX(0);transform-origin:left;transition:transform .32s var(--ease-out)}
.sc:hover::after{transform:scaleX(1)}
.sc-t::after{background:linear-gradient(90deg,var(--terra),var(--rust))}.sc-f::after{background:linear-gradient(90deg,var(--forest),var(--sage))}.sc-g::after{background:linear-gradient(90deg,var(--gold),var(--gold2))}.sc-s::after{background:linear-gradient(90deg,var(--sage),var(--sage2))}
.sci{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px}
.sci-t{background:rgba(200,115,90,.1)}.sci-f{background:rgba(45,74,62,.1)}.sci-g{background:rgba(200,164,90,.12)}.sci-s{background:rgba(107,143,113,.1)}
.slb{font-size:.7rem;color:var(--fog);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sv{font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1;font-family:var(--serif)}
.ss{font-size:.72rem;color:var(--fog);margin-top:5px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
thead th{padding:9px 14px;text-align:left;font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fog);font-family:var(--mono);border-bottom:1px solid var(--warm);background:var(--cream);position:sticky;top:0}
tbody td{padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.03);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(240,232,219,.6)}
tbody tr:last-child td{border-bottom:none}

/* BADGES */
.bx{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:600;font-family:var(--mono)}
.bx::before{content:'•'}
.bg{background:rgba(45,106,79,.1);color:#1e5e3a;border:1px solid rgba(45,106,79,.2)}
.br{background:rgba(164,38,44,.08);color:#8a1a20;border:1px solid rgba(164,38,44,.15)}
.bo{background:rgba(200,164,90,.12);color:#7a5e1a;border:1px solid rgba(200,164,90,.25)}
.bt{background:rgba(200,115,90,.1);color:var(--rust);border:1px solid rgba(200,115,90,.2)}
.bf{background:rgba(45,74,62,.1);color:var(--forest2);border:1px solid rgba(45,74,62,.2)}
.bz{background:rgba(107,107,107,.08);color:var(--mist);border:1px solid rgba(107,107,107,.15)}
.bp{background:rgba(139,62,47,.1);color:var(--rust);border:1px solid rgba(139,62,47,.25)}

/* UPLOAD ZONE */
.upzone{border:2px dashed var(--sand);border-radius:var(--rl);padding:2.5rem;text-align:center;cursor:pointer;transition:border-color .22s,background .22s,transform .22s var(--ease-out);background:var(--cream)}
.upzone:hover{border-color:var(--terra);background:rgba(200,115,90,.04);transform:scale(1.005)}
.upzone.drag{border-color:var(--terra);background:rgba(200,115,90,.07);transform:scale(1.01)}
.upi{font-size:2.5rem;margin-bottom:1rem}.upt{font-size:.95rem;font-weight:700;margin-bottom:4px;font-family:var(--serif)}.ups{font-size:.78rem;color:var(--fog)}

/* STEPPER */
.stepper{display:flex;flex-direction:column;gap:0}
.step{display:flex;align-items:flex-start;gap:14px;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;left:13px;top:30px;width:2px;height:calc(100% - 8px);background:var(--warm);transition:background .4s}
.step.done::after{background:var(--sage)}
.step-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;font-family:var(--mono);flex-shrink:0;z-index:1;transition:all .3s var(--ease-out)}
.step.done .step-ic{background:rgba(45,106,79,.15);color:#1e5e3a;border:2px solid #2d6a4f}
.step.active .step-ic{background:rgba(200,115,90,.12);color:var(--terra);border:2px solid var(--terra);animation:ring 1.1s ease infinite}
.step.wait .step-ic{background:var(--cream);color:var(--fog);border:2px solid var(--sand)}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(200,115,90,.3)}50%{box-shadow:0 0 0 6px rgba(200,115,90,0)}}
.step-body{padding-bottom:20px}.step-t{font-size:.82rem;font-weight:700;margin-bottom:2px}.step-d{font-size:.72rem;color:var(--mist)}

/* VERIFY RESULT */
.vb{border-radius:var(--rl);padding:1.4rem;margin-top:.75rem;animation:sldIn .3s var(--ease-out) both}
@keyframes sldIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.vb.ok{background:rgba(45,106,79,.06);border:1px solid rgba(45,106,79,.2)}
.vb.fail{background:rgba(164,38,44,.06);border:1px solid rgba(164,38,44,.15)}
.vb.wait{background:rgba(200,164,90,.07);border:1px solid rgba(200,164,90,.22)}
.vt{font-size:1rem;font-weight:700;margin-bottom:6px;font-family:var(--serif)}
.vd{font-size:.82rem;color:var(--mist);line-height:1.7}
.kvg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--cream);border-radius:var(--r);padding:12px;border:1px solid var(--warm);margin-top:10px}
.kvk{font-size:.65rem;color:var(--fog);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.kvv{font-size:.82rem;font-weight:600;color:var(--charcoal)}

/* PBAR */
.pbar{height:5px;border-radius:3px;background:var(--warm);overflow:hidden}
.pfil{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--terra),var(--gold));transition:width .8s var(--ease-spring)}

/* COURSES */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.cc{background:#fff;border:1px solid var(--sand);border-radius:var(--rl);padding:1.3rem;transition:transform .22s var(--ease-out),box-shadow .22s,border-color .22s}
.cc:hover{border-color:var(--terra);transform:translateY(-3px);box-shadow:var(--shl)}
.ccp{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--terra);margin-bottom:9px;font-family:var(--mono)}
.cct{font-size:.92rem;font-weight:700;margin-bottom:6px;line-height:1.4;font-family:var(--serif)}
.ccm{font-size:.73rem;color:var(--fog);margin-bottom:12px;font-family:var(--mono)}
.ccf{display:flex;align-items:center;justify-content:space-between}

/* FACULTY CARDS */
.fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem}
.fac-card{background:#fff;border:1px solid var(--sand);border-radius:var(--rl);padding:1.5rem;display:flex;flex-direction:column;gap:1rem;transition:transform .22s var(--ease-out),box-shadow .22s,border-color .22s;position:relative;overflow:hidden}
.fac-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--terra),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease-out)}
.fac-card:hover{transform:translateY(-4px);box-shadow:var(--shl);border-color:rgba(200,115,90,.25)}.fac-card:hover::before{transform:scaleX(1)}
.fac-hd{display:flex;align-items:flex-start;gap:14px}
.fac-av{width:52px;height:52px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:#fff;font-family:var(--serif)}
.fac-nm{font-size:.95rem;font-weight:700;letter-spacing:-.02em;font-family:var(--serif);line-height:1.3;margin-bottom:2px}
.fac-role{font-size:.72rem;color:var(--terra);font-weight:600;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.fac-qual{font-size:.75rem;color:var(--mist);margin-top:2px}
.fac-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.fac-tag{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:600;background:var(--warm);border:1px solid var(--sand);color:var(--mist);font-family:var(--mono);transition:all .15s}
.fac-card:hover .fac-tag{background:rgba(200,115,90,.06);border-color:rgba(200,115,90,.2);color:var(--rust)}
.fac-profile{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--terra);text-decoration:none;font-family:var(--mono);transition:opacity .2s}.fac-profile:hover{opacity:.7}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(26,26,26,.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;animation:ovIn .2s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border:1px solid var(--sand);border-radius:var(--rxl);padding:2rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shl);animation:modIn .28s var(--ease-spring) both}
@keyframes modIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mtitle{font-family:var(--serif);font-size:1.3rem;font-weight:700;margin-bottom:1.5rem}
.mft{display:flex;gap:10px;justify-content:flex-end;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--warm)}

/* CERT VIEWER MODAL */
.cert-img-wrap{background:var(--cream);border:1px solid var(--sand);border-radius:var(--r);padding:1rem;text-align:center;margin:1rem 0}
.cert-img-wrap img{max-width:100%;border-radius:6px;box-shadow:var(--shm)}
.name-match{padding:12px 16px;border-radius:var(--r);margin-bottom:1rem;font-size:.83rem;font-weight:600}
.name-match.ok{background:rgba(45,106,79,.08);border:1px solid rgba(45,106,79,.2);color:#1e5e3a}

/* ═══════════════════════════════════════════════════════════
   FIX #3 — NAME MATCHING (rewritten from scratch)

   Strategy:
   1. Strip honorifics (Dr, Mr, Ms, Prof…) from both sides
   2. Lowercase, remove punctuation
   3. Split into word tokens
   4. Count how many tokens from the shorter name appear in the longer one
   5. Score = matched tokens / max(len_a, len_b)
   6. Boost to 0.85 if all tokens of one name are present in the other
      (handles "Adipelly Priyal" vs "Adipelly Priyal Ravi")
   7. Separate threshold for initials (single-char tokens)
   ═══════════════════════════════════════════════════════════ */
const HONORIFICS = new Set(['dr','mr','mrs','ms','prof','professor','sir','shri','smt','er']);

function normName(raw){
  if(!raw || typeof raw !== 'string') return [];
  return raw
    .toLowerCase()
    .replace(/[^a-z\s]/g, ' ')   // punctuation → space
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length > 0 && !HONORIFICS.has(w));
}

function tokenContains(haystack, needle){
  // Returns true if needle word appears in or starts a haystack word
  // (handles abbreviations like "ravi" matching "r" initial, etc.)
  return haystack.some(h =>
    h === needle ||
    (needle.length === 1 && h.startsWith(needle)) ||  // initial match
    (needle.length > 3 && h.startsWith(needle.slice(0,4)))  // prefix match
  );
}

function nameSimilarity(certName, studentName){
  const ca = normName(certName);
  const sa = normName(studentName);
  if(!ca.length || !sa.length) return 0;

  // Count matches both ways and take the better direction
  const matchAinB = ca.filter(w => tokenContains(sa, w)).length;
  const matchBinA = sa.filter(w => tokenContains(ca, w)).length;

  const scoreAinB = matchAinB / Math.max(ca.length, sa.length);
  const scoreBinA = matchBinA / Math.max(ca.length, sa.length);
  let score = Math.max(scoreAinB, scoreBinA);

  // Boost: if ALL tokens of the shorter name appear in the longer → strong match
  const shorter = ca.length <= sa.length ? ca : sa;
  const longer  = ca.length <= sa.length ? sa : ca;
  const allShorterInLonger = shorter.every(w => tokenContains(longer, w));
  if(allShorterInLonger && shorter.length >= 2) score = Math.max(score, 0.85);

  // Boost: first-word (surname/first name) exact match is a strong signal
  if(ca[0] && sa[0] && ca[0] === sa[0]) score = Math.max(score, 0.6);

  return score;
}

function matchStudentName(certName, studentName){
  if(!certName || certName === '—' || certName.trim() === ''){
    return { score: 0, label: 'Name not found on certificate', cls: 'warn' };
  }
  const sim = nameSimilarity(certName, studentName);
  const pct = Math.round(sim * 100);
  if(sim >= 0.7)  return { score: pct, label: `Name matched (${pct}%)`, cls: 'ok' };
  if(sim >= 0.4)  return { score: pct, label: `Partial match — faculty review needed (${pct}%)`, cls: 'warn' };
  return { score: pct, label: `Name mismatch — certificate may not belong to this student (${pct}%)`, cls: 'fail' };

/* ── TOAST ────────────────────────────────────────────────── */
function showToast(msg, type='info'){
  if(S.toastTimer) clearTimeout(S.toastTimer);
  const icons = {info:'ℹ️',success:'✅',error:'❌',warning:'⚠️'};
  const html = `<div class="toast" id="t_now"><div class="ti">${icons[type]||'ℹ️'}</div><div class="tm">${msg}</div></div>`;
  const ex = document.querySelector('.toast');
  if(ex) ex.outerHTML = html; else document.body.insertAdjacentHTML('beforeend', html);
  S.toastTimer = setTimeout(()=>{ const el=document.getElementById('t_now'); if(el){el.classList.add('out');setTimeout(()=>el.remove(),260);} }, 3800);
}

/* ── COUNT ANIM ───────────────────────────────────────────── */
function animCount(){
  document.querySelectorAll('[data-cnt]').forEach(el=>{
    const t = parseInt(el.dataset.cnt); let n = 0; const s = Math.ceil(t/24);
    const iv = setInterval(()=>{ n=Math.min(n+s,t); el.textContent=n; if(n>=t) clearInterval(iv); }, 40);
  });
}

async function syncCertsFromDB(){

async function syncCoursesFromDB(){

async function saveCertToDB(cert){
  await sb.upsert('certificates', {
    id: cert.id, student: cert.student, rollno: cert.rollno,
    course: cert.course, platform: cert.platform,
    upload_date: cert.uploadDate, status: cert.status,
    score: cert.score, issuer: cert.issuer,
    cert_image: cert.certImage,
    extracted_name: cert.extractedName,
    name_match_score: cert.nameMatchScore,
    flags: cert.flags, confidence: cert.confidence
  });
}

async function updateCertStatusDB(id, status){
  await sb.update('certificates', {status}, `id=eq.${id}`);
  await syncStudentProgressToDB();
}

async function syncStudentProgressToDB(){
  for(const s of S.stus){
    const mine = S.certs.filter(c=>c.rollno===s.rollno);
    const ver  = mine.filter(c=>c.status==='verified').length;
    const prog = mine.length ? Math.round((ver/mine.length)*100) : 0;
    await sb.update('students', {certs: mine.length, progress: prog}, `rollno=eq.${s.rollno}`);
  }
}

async function uploadCertImage(file, certId){
  if(!SB_READY || !file) return null;
  const ext = file.name.split('.').pop();
  const path = `certs/${certId}.${ext}`;
  const url = await sb.uploadFile('certificates', path, file);
  return url;
}

/* ═══════════════════════════════════════════════════════════
   FIX #1 — DIRECT SAVE ON UPLOAD (no Flask dependency)

   Flow:
   1. User fills form and clicks Verify
   2. Image is read into base64 and shown as preview immediately
   3. IF Flask is online  → try OCR path (existing pollTask logic)
   4. IF Flask is offline → save cert directly as "pending" with
      the image stored in Supabase Storage (if configured).
      Certificate appears in the table immediately.
   ═══════════════════════════════════════════════════════════ */

async function verifyCert(){
  if(!S.upFile){ showToast('Please select a certificate file first','error'); return; }
  const platform = document.getElementById('cp')?.value||'NPTEL';
  const course   = (document.getElementById('cc')?.value||'').trim();
  const scoreVal = (document.getElementById('cs')?.value||'').trim();
  const dateVal  = document.getElementById('cd')?.value || new Date().toISOString().split('T')[0];

  S.verifying = true; S.vresult = null; S.verifyStep = 1; render();

  // ── Try Flask first ──────────────────────────────────────
  if(svcStatus === 'online'){
    try{
      const fd = new FormData();
      fd.append('file', S.upFile); fd.append('platform', platform); fd.append('course', course); fd.append('student_name', S.user.name||'');
      const res = await fetch(getAPI()+'/api/verify', {method:'POST', body:fd, signal:AbortSignal.timeout(12000)});
      if(res.ok){
        const {task_id} = await res.json();
        S.taskId = task_id; S.verifyStep = 2; render();
        showToast('Certificate uploaded — processing…','info');
        await pollTask(task_id, platform, course, dateVal);
        return; // done via Flask path
      }
    } catch(e){
      // Flask call failed — fall through to direct save
    }
  }

  // ── Direct save path (Flask offline or failed) ───────────
  S.verifyStep = 2; render();
  showToast('Backend offline — saving certificate for faculty review…','warning');

  const certId  = 'cert_'+Date.now();
  let imgUrl    = S.upImg || null;

  // Try to upload image to Supabase Storage
  if(SB_READY && S.upFile){
    const storageUrl = await uploadCertImage(S.upFile, certId);
    if(storageUrl) imgUrl = storageUrl;
  }

  // Name matching: no OCR available, so extracted name = ''
  // We record it as "not extracted" rather than false-flagging a mismatch
  const certRec = {
    id: certId,
    student:    S.user.name,
    rollno:     S.user.rollno,
    course:     course || platform + ' Course',
    platform,
    uploadDate: dateVal,
    status:     'pending',          // faculty must review manually
    score:      scoreVal ? parseInt(scoreVal) : null,
    issuer:     platform,
    certImage:  imgUrl,
    extractedName:   '',            // no OCR — leave blank
    nameMatchScore:  null,          // explicitly null = not yet checked
    flags:      ['Uploaded without OCR — manual review required'],
    confidence: 'pending'
  };

  S.certs.unshift(certRec);
  updateLocalStudentProgress(S.user.rollno);
  if(SB_READY) await saveCertToDB(certRec);

  S.verifyStep = 3;
  S.vresult = {
    valid:   false,
    pending: true,
    confidence: 'pending',
    title:   '📋 Saved — Awaiting Faculty Review',
    detail:  'Your certificate has been saved successfully. Since the verification service is currently unavailable, a faculty member will review it manually. You\'ll see the status update in My Certificates.',
    extracted: { Course: course||platform+' Course', Platform: platform, Date: dateVal },
    flags:   ['Auto-OCR unavailable — manual review queued'],
    nameMatch: { score: 0, label: 'Name check will be done during manual review', cls: 'warn' }
  };

  S.verifying = false; render();
  showToast('Certificate saved — pending faculty review', 'info');
}

/* ── Poll Flask for OCR result ───────────────────────────── */
async function pollTask(taskId, platform, course, dateVal){
  const MAX = 60, DELAY = 2000;          // ~2 min ceiling
  const today = dateVal || new Date().toISOString().split('T')[0];

  // Always-safe fallback: save as pending for manual review, never leave UI spinning
  async function saveFallback(reason, title, detail){
    try{
      const certId = 'cert_'+Date.now();
      let imgUrl = S.upImg||null;
      if(SB_READY && S.upFile){
        const u = await uploadCertImage(S.upFile, certId);
        if(u) imgUrl = u;
      }
      const certRec = {
        id: certId, student: S.user.name, rollno: S.user.rollno,
        course: course||platform+' Course', platform, uploadDate: today,
        status: 'pending', score: null, issuer: platform,
        certImage: imgUrl, extractedName: '', nameMatchScore: null,
        flags: [reason], confidence: 'pending'
      };
      S.certs.unshift(certRec);
      updateLocalStudentProgress(S.user.rollno);
      if(SB_READY) await saveCertToDB(certRec);
      S.vresult = {valid:false, pending:true, confidence:'low', title, detail, extracted:{}, flags:[reason]};
      S.verifyStep = 3;
    } catch(e){
      S.vresult = {valid:false, pending:true, confidence:'low', title:'Processing Error', detail:String(e), extracted:{}, flags:[reason]};
      S.verifyStep = 0;
    }
    S.verifying = false; render();
  }

  for(let attempt = 1; attempt <= MAX; attempt++){
    await new Promise(r=>setTimeout(r, DELAY));
    let d;
    try{
      const r = await fetch(getAPI()+`/api/verify/${encodeURIComponent(taskId)}`, {signal:AbortSignal.timeout(5000)});
      d = await r.json();
    } catch(e){ continue; }              // transient network error → retry

    if(d.status === 'done'){
      try{
        const res = d.result;
        const extractedName = res.extracted?.['Student Name'] || res.extracted?.['Name'] || '';
        const nm = matchStudentName(extractedName, S.user.name);
        res.nameMatch = nm;

        let finalStatus = 'manual_review';
        if(res.valid && nm.score >= 70) finalStatus = 'verified';

        S.vresult = res; S.verifyStep = 3;

        const certId = 'cert_'+Date.now();
        let imgUrl = S.upImg || null;
        if(SB_READY && S.upFile){
          const u = await uploadCertImage(S.upFile, certId);
          if(u) imgUrl = u;
        }
        const certRec = {
          id: certId, student: S.user.name, rollno: S.user.rollno,
          course: res.extracted?.Course || course || platform+' Course',
          platform, uploadDate: today, status: finalStatus,
          score: res.extracted?.Score ? parseInt(res.extracted.Score) : null,
          issuer: res.extracted?.Issuer || platform,
          certImage: imgUrl, extractedName, nameMatchScore: nm.score,
          flags: res.flags || [], confidence: res.confidence
        };
        S.certs.unshift(certRec);
        updateLocalStudentProgress(S.user.rollno);
        if(SB_READY) await saveCertToDB(certRec);
        S.verifying = false; render();
        showToast(finalStatus==='verified' ? '✅ Certificate verified!' : '⚠️ Flagged for manual review — name needs verification',
                  finalStatus==='verified' ? 'success' : 'warning');
      } catch(e){
        console.error('post-OCR handling failed', e);
        S.verifying = false; render();
        showToast('OCR finished but saving failed: '+(e.message||e),'error');
      }
      return;
    }

    if(d.status === 'error'){
      S.vresult = {valid:false, pending:true, confidence:'low', title:'Processing Error', detail:d.error||'Error occurred.', extracted:{}, flags:[d.error||'error']};
      S.verifying = false; S.verifyStep = 0; render(); showToast('Processing failed: '+(d.error||''),'error');
      return;
    }
    // 'pending' / 'processing' → keep polling
  }

  await saveFallback('OCR timed out — manual review required', 'Saved — OCR Timed Out',
    'The OCR scan took too long. Your certificate has been saved and queued for manual faculty review.');
  showToast('OCR timed out — saved for faculty review','warning');
}

/* Update student progress in memory */
function updateLocalStudentProgress(rollno){
  const stu = S.stus.find(s=>s.rollno===rollno);
  if(!stu) return;
  const mine = S.certs.filter(c=>c.rollno===rollno);
  stu.certs    = mine.length;
  stu.progress = mine.length ? Math.round(mine.filter(c=>c.status==='verified').length/mine.length*100) : 0;
}

function verifyCard(){
  const r = S.vresult;
  const cls = r.valid ? 'ok' : r.pending ? 'wait' : 'fail';
  const icon = r.valid ? '✅' : r.pending ? '⚠️' : '❌';
  return `<div class="card" style="margin-bottom:1rem">
    <div class="ch"><div class="ct">Submission Result</div>${r.confidence?`<span class="bx ${r.confidence==='high'?'bg':r.confidence==='pending'||r.confidence==='medium'?'bo':'br'}">${r.confidence}</span>`:''}</div>
    <div class="cb">
      <div class="vb ${cls}"><div class="vt">${icon} ${r.title}</div><div class="vd">${r.detail}</div></div>
      ${r.nameMatch ? `<div class="name-match ${r.nameMatch.cls}" style="margin-top:10px">👤 ${r.nameMatch.label}</div>` : ''}
      ${r.extracted && Object.keys(r.extracted).length ? `<div class="kvg mt3">${Object.entries(r.extracted).map(([k,v])=>`<div><div class="kvk">${k}</div><div class="kvv">${v||'—'}</div></div>`).join('')}</div>` : ''}
      ${r.flags?.length ? `<div class="mt3" style="background:rgba(200,164,90,.07);border:1px solid rgba(200,164,90,.2);border-radius:var(--r);padding:10px">${r.flags.map(f=>`<div class="xs mu" style="margin-bottom:2px">⚠ ${f}</div>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

/* ── CERTIFICATE VIEW MODAL ──────────────────────────────── */
/* FIX #2: approve/reject buttons only shown if viewer is faculty */
function certViewMod(){
  const c = S.certs.find(x=>x.id===S.modViewCert); if(!c) return '';
  const stu = S.stus.find(s=>s.rollno===c.rollno);
  const isFaculty = S.user?.role === 'teacher';

  // If name was extracted use matching; if not, show "pending" state
  let nm;
  if(c.nameMatchScore != null){
    nm = { score: c.nameMatchScore, label: c.nameMatchScore>=70 ? `Name matched (${c.nameMatchScore}%)` : c.nameMatchScore>=40 ? `Partial match (${c.nameMatchScore}%)` : `Name mismatch (${c.nameMatchScore}%)`, cls: c.nameMatchScore>=70?'ok':c.nameMatchScore>=40?'warn':'fail' };
  } else {
    nm = { score: 0, label: 'Name not yet checked — OCR unavailable at upload time', cls: 'warn' };
  }

  return `<div class="overlay" onclick="if(event.target===this)closeM()">
    <div class="modal" style="max-width:640px">
      <div class="mtitle">🎓 Certificate — ${c.student}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem;font-size:.82rem">
        <div><div class="xs mu mo">Course</div><div class="bld">${c.course}</div></div>
        <div><div class="xs mu mo">Platform</div><div class="bld">${c.platform}</div></div>
        <div><div class="xs mu mo">Submitted</div><div class="bld">${c.uploadDate}</div></div>
        <div><div class="xs mu mo">Status</div><span class="bx ${statusCls(c.status)}">${c.status.replace('_',' ')}</span></div>
      </div>
      <div class="name-match ${nm.cls}">👤 ${nm.label}</div>
      ${c.extractedName ? `<div style="font-size:.78rem;color:var(--mist);margin-bottom:1rem">Name on certificate: <strong>${c.extractedName}</strong> · Student record: <strong>${stu?.name||'Unknown'}</strong></div>` : ''}
      ${c.certImage
        ? `<div class="cert-img-wrap"><img src="${c.certImage}" alt="Certificate" onerror="this.src='';this.parentElement.innerHTML='<div style=padding:1rem;color:var(--fog);font-size:.82rem>Image could not be loaded</div>'"/></div>`
        : `<div style="background:var(--cream);border:1px dashed var(--sand);border-radius:var(--r);padding:2rem;text-align:center;color:var(--fog);font-size:.82rem;margin-bottom:1rem">No certificate image available</div>`}
      ${c.flags?.length ? `<div style="background:rgba(200,164,90,.07);border:1px solid rgba(200,164,90,.2);border-radius:var(--r);padding:10px;margin-bottom:1rem">${c.flags.map(f=>`<div class="xs mu">⚠ ${f}</div>`).join('')}</div>` : ''}
      ${!isFaculty ? `<div style="background:rgba(45,74,62,.06);border:1px solid rgba(45,74,62,.2);border-radius:var(--r);padding:10px;margin-bottom:1rem;font-size:.78rem;color:var(--forest)">ℹ Certificate status is managed by faculty. Contact your professor if there's an issue.</div>` : ''}
      <div class="mft">
        <button class="btn btn-g" onclick="closeM()">Close</button>
        ${isFaculty && (c.status==='pending'||c.status==='manual_review')
          ? `<button class="btn btn-err" onclick="rejectCert('${c.id}');closeM()">✗ Reject</button><button class="btn btn-ok" onclick="approveCert('${c.id}');closeM()">✓ Approve</button>`
          : ''}
      </div>
    </div>
  </div>`;
}

function stuDetailMod(){
  const s = S.stus.find(x=>x.rollno===S.modViewStu); if(!s) return '';
  const mine = S.certs.filter(c=>c.rollno===s.rollno);
  const ver  = mine.filter(c=>c.status==='verified').length;
  const prog = mine.length ? Math.round(ver/mine.length*100) : 0;
  return `<div class="overlay" onclick="if(event.target===this)closeM()">
    <div class="modal" style="max-width:600px">
      <div class="mtitle">👤 ${s.name}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;font-size:.82rem">
        <div><div class="xs mu mo">Roll No</div><div class="bld">${s.rollno}</div></div>
        <div><div class="xs mu mo">Year</div><div class="bld">${s.year}</div></div>
        <div><div class="xs mu mo">Email</div><div class="bld xs">${s.email||'—'}</div></div>
        <div><div class="xs mu mo">Enrolment</div><div class="bld xs mo">${s.enrolment||'—'}</div></div>
      </div>
      <div style="margin-bottom:1.5rem">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="sm bld">Verification Progress</span><span class="sm bld" style="color:var(--terra)">${prog}%</span></div>
        <div class="pbar" style="height:8px"><div class="pfil" style="width:${prog}%"></div></div>
        <div class="xs mu" style="margin-top:4px">${ver} of ${mine.length} certificates verified</div>
      </div>
      ${mine.length ? `<div style="font-weight:700;font-size:.82rem;margin-bottom:10px">Certificates (${mine.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px">${mine.map(c=>`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream);border-radius:var(--r);border:1px solid var(--warm)">
          <div style="flex:1"><div class="sm bld">${c.course}</div><div class="xs mu mo">${c.platform} · ${c.uploadDate}</div></div>
          ${c.nameMatchScore!=null ? `<span class="bx ${c.nameMatchScore>=70?'bg':c.nameMatchScore>=40?'bo':'br'}" style="font-size:.62rem">${c.nameMatchScore}%</span>` : `<span class="bx bz" style="font-size:.62rem">—</span>`}
          <span class="bx ${statusCls(c.status)}" style="font-size:.62rem">${c.status.replace('_',' ')}</span>
          ${c.certImage ? `<button class="btn btn-g btn-xs" onclick="viewCert('${c.id}')">👁 View</button>` : ''}
          ${(c.status==='pending'||c.status==='manual_review') ? `<button class="btn btn-ok btn-xs" onclick="approveCert('${c.id}')">✓</button><button class="btn btn-err btn-xs" onclick="rejectCert('${c.id}')">✗</button>` : ''}
        </div>`).join('')}</div>`
      : `<div class="emp" style="padding:1.5rem"><div class="empi">📂</div><div class="empt">No certificates uploaded yet</div></div>`}
      <div class="mft"><button class="btn btn-g" onclick="closeM()">Close</button></div>
    </div>
  </div>`;
}

function credsModal(){
  const stuUsers = Object.entries(USERS).filter(([,u])=>u.role==='student');
  return `<div class="overlay" onclick="if(event.target===this)closeM()">
    <div class="modal" style="max-width:640px">
      <div class="mtitle">🔑 Student Login Credentials</div>
      <div style="font-size:.75rem;color:var(--mist);margin-bottom:1rem">Share these with students. Password pattern: rollno + first 3 chars of last name.</div>
      <div style="background:var(--cream);border:1px solid var(--sand);border-radius:var(--r);padding:12px;max-height:50vh;overflow-y:auto;font-family:var(--mono);font-size:.72rem;line-height:2">
        ${stuUsers.map(([em,u])=>`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-bottom:1px solid var(--warm);padding:4px 0"><span style="color:var(--charcoal);font-weight:600">${u.name}</span><span style="color:var(--mist)">${em}</span><span style="color:var(--terra)">${u.pass}</span></div>`).join('')}
      </div>
      <div class="mft"><button class="btn btn-g" onclick="closeM()">Close</button></div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   CHATBOT
   ═══════════════════════════════════════════════════════════ */
const FAQ = [
  [/^(hi|hello|hey)\b/i, "Hello! 👋 I'm CertBot. Ask me about uploading certificates, checking status, or navigating CertTrack!"],
  [/upload|submit/i, "Go to **Upload Certificate** → fill platform & course → drop your image or PDF → click Submit. Your certificate is saved immediately, even if the OCR service is offline. 📤"],
  [/nptel/i, "For NPTEL: upload the final certificate (not the score card). Your name, course title, and IIT/NIT name must be clearly visible. 🎓"],
  [/coursera/i, "For Coursera: download the PDF certificate. It should show your name, course title, and the issuing university. ✅"],
  [/edx/i, "For edX: screenshot the verified certificate page — the edX logo and institution must be visible. 📜"],
  [/pending|status/i, "**Pending** = saved, waiting for faculty review. **Manual Review** = flagged for faculty to verify. **Verified** = all good! **Rejected** = re-upload a clearer image.\n\nStudents cannot change their own certificate status — only faculty can approve or reject."],
  [/approve|reject|can i/i, "Only faculty can approve or reject certificates. Students can view their certificates but cannot change the status. Contact your faculty if you think there's been an error."],
  [/name.*(match|wrong|mismatch)/i, "Name matching compares the name OCR'd from your certificate with your student record. If the OCR service was offline when you uploaded, name matching will be done during manual faculty review. Ensure your full name is clearly visible on the certificate. 👤"],
  [/offline|service|backend/i, "If the OCR service is offline, your certificate is still saved immediately as **Pending** status. A faculty member will review it manually. You don't need to re-upload."],
  [/password|login|creden/i, "Student login: firstname+rollno@frcrce.ac.in · Password: rollno+first3charsOfLastName. E.g. Roll 10514, last name Ravi → password: 10514rav"],
  [/faculty|teacher/i, "The Faculty tab lists all ECS professors with their research areas and profile links. 🏛️"],
  [/supabase|database|cloud/i, "CertTrack uses Supabase for cloud storage. Configure SUPABASE_URL and SUPABASE_ANON at the top of index.html. Certificates are stored immediately on upload."],
  [/thank/i, "You're welcome! 😊"],
  [/help/i, "I can help with: uploading certificates, checking status, login credentials, name matching, offline behaviour, and navigation. Just ask! 🤖"],
];
function offlineReply(msg){ for(const [p,r] of FAQ) if(p.test(msg)) return r; return "Ask me about uploading certificates, checking status, or login help. Type **help** for a full list! 🤖"; }

function chatWid(){ return `
<button class="cfab" onclick="toggleChat()">${S.chatOpen?'✕':'💬'}</button>
${S.chatOpen ? `<div class="cwin">
  <div class="chd"><div class="chdt"><div class="cdot"></div>CertBot · Assistant</div><button class="cclose" onclick="toggleChat()">✕</button></div>
  <div class="cmsgs" id="cmsgs">
    ${S.chatMsgs.map(m=>`<div class="msg ${m.role}"><div class="mb">${m.text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div><div class="mt">${m.time}</div></div>`).join('')}
    ${S.chatLoading ? `<div class="msg bot"><div class="typing"><span></span><span></span><span></span></div></div>` : ''}
  </div>
  <div class="cinp">
    <input id="cIn" type="text" placeholder="Ask me anything…" onkeydown="if(event.key==='Enter')sendChat()" autocomplete="off"/>
    <button class="csend" onclick="sendChat()" ${S.chatLoading?'disabled':''}>▶</button>
  </div>
</div>` : ''}`;
}
async function sendChat(){
  const inp = document.getElementById('cIn'); if(!inp) return;
  const msg = inp.value.trim(); if(!msg) return;
  inp.value = '';
  S.chatMsgs.push({role:'user', text:msg, time:nt()});
  S.chatLoading = true; render();
  setTimeout(()=>{
    S.chatMsgs.push({role:'bot', text:offlineReply(msg), time:nt()});
    S.chatLoading = false; render();
    setTimeout(()=>{ const m=document.getElementById('cmsgs'); if(m) m.scrollTop=m.scrollHeight; }, 60);
  }, 400);
}
function toggleChat(){ S.chatOpen=!S.chatOpen; render(); if(S.chatOpen) setTimeout(()=>{ const m=document.getElementById('cmsgs'); if(m) m.scrollTop=m.scrollHeight; },100); }

/* ═══════════════════════════════════════════════════════════
   EVENT HANDLERS
   ═══════════════════════════════════════════════════════════ */
function bindEvts(){
  const f = document.getElementById('lf');
  if(f) f.addEventListener('submit', e=>{ e.preventDefault(); doLogin(); });
}

function setTab(t){ S.atab = t; render(); }

function doLogin(){
  const em = document.getElementById('le').value.trim();
  const pw = document.getElementById('lp').value.trim();
  const u  = USERS[em];
  if(!u || u.pass!==pw){ showToast('Invalid email or password','error'); return; }
  if(S.atab==='student' && u.role!=='student'){ showToast('Please use the Student tab','error'); return; }
  if(S.atab==='teacher' && u.role!=='teacher'){ showToast('Please use the Faculty tab','error'); return; }
  S.user = {email:em, ...u}; S.page = 'app'; S.apg = 'dashboard';
  S._certViewMode = null;
  if(SB_READY){
    syncCertsFromDB();
    syncCoursesFromDB();
  }
  checkService(); render();
}

function logout(){
  S.user = null; S.page = 'auth'; S.vresult = null;
  S.upFile = null; S.upImg = null; S.verifyStep = 0;
  S.chatOpen = false; S.certs = []; S.courses = [...COURSES_DEFAULT];
  S._certViewMode = null;
  render();
}

function go(p){ S.apg = p; S.vresult = null; render(); }
function trigFile(){ document.getElementById('fi')?.click(); }

function fileChange(inp){
  if(!inp.files?.[0]) return;
  const f = inp.files[0]; S.upFile = f; S.upImg = null;
  if(f.type.startsWith('image/')){
    const r = new FileReader(); r.onload = e=>{ S.upImg=e.target.result; render(); }; r.readAsDataURL(f);
  } else { render(); }
}

function dropFile(e){
  e.preventDefault(); document.getElementById('uz')?.classList.remove('drag');
  const f = e.dataTransfer.files[0]; if(!f) return; S.upFile = f; S.upImg = null;
  if(f.type.startsWith('image/')){
    const r = new FileReader(); r.onload = ev=>{ S.upImg=ev.target.result; render(); }; r.readAsDataURL(f);
  } else { render(); }
}

/* FIX #2 — approve/reject are faculty-only operations */
async function approveCert(id){
  if(S.user?.role !== 'teacher'){ showToast('Only faculty can approve certificates','error'); return; }
  S.certs = S.certs.map(c=>c.id===id ? {...c, status:'verified'} : c);
  updateLocalStudentProgress(S.certs.find(c=>c.id===id)?.rollno);
  if(SB_READY) await updateCertStatusDB(id, 'verified');
  showToast('Certificate approved ✓','success'); render();
}

async function rejectCert(id){
  if(S.user?.role !== 'teacher'){ showToast('Only faculty can reject certificates','error'); return; }
  S.certs = S.certs.map(c=>c.id===id ? {...c, status:'rejected'} : c);
  if(SB_READY) await updateCertStatusDB(id, 'rejected');
  showToast('Certificate rejected','error'); render();
}

/* Faculty opens cert view */
function viewCert(id){
  S.modViewCert = id;
  S._certViewMode = 'faculty';
  render();
}

function viewStu(rollno){ S.modViewStu = rollno; render(); }
function openAssign(){ S.modAssign = true; render(); }
function openAdd(){ S.modAdd = true; render(); }
function openCfg(){ S.modCfg = true; render(); }
function openCreds(){ S.modCreds = true; render(); }
function closeM(){ S.modAssign=false; S.modAdd=false; S.modCfg=false; S.modViewCert=null; S.modViewStu=null; S.modCreds=false; S._certViewMode=null; render(); }

function renderStuTable(){
  const q = (S.stuSearch||'').toLowerCase();
  const arr = q ? S.stus.filter(s=>s.name.toLowerCase().includes(q)||s.rollno.includes(q)) : S.stus;
  const b = document.getElementById('stuB'); if(b) b.innerHTML = stuRows(arr);
}

function saveCfgUrl(){
  const u = document.getElementById('bUrl')?.value?.trim();
  if(!u){ showToast('Enter a valid URL','error'); return; }
  setAPI(u); showToast('Settings saved — testing…','info'); checkService(); closeM();
}

function prefillCourse(id){
  const c = S.courses.find(x=>x.id===id); if(!c) return;
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.value=val||''; };
  set('aPlat', c.platform); set('aTitle', c.title);
  set('aDur', c.duration); set('aCred', c.credits);
  set('aDeadline', c.deadline);
}

async function submitAssign(){
  const existId  = document.getElementById('aC')?.value;
  const title    = document.getElementById('aTitle')?.value.trim();
  const plat     = document.getElementById('aPlat')?.value.trim();
  const creds    = parseInt(document.getElementById('aCred')?.value)||3;
  const dur      = document.getElementById('aDur')?.value.trim()||'—';
  const deadline = document.getElementById('aDeadline')?.value||'';
  const assignTo = document.getElementById('aTo')?.value||'all';

  if(!title || !plat){ showToast('Platform and course title are required','error'); return; }

  let course = existId ? S.courses.find(c=>c.id===existId) : null;

  if(!course){
    course = {
      id: 'c_'+Date.now(), platform:plat, title, duration:dur,
      credits:creds, deadline, assigned:true, assigned_to:assignTo,
      created_by: S.user.email
    };
    S.courses.push(course);
    if(SB_READY){
      await sb.upsert('courses', {
        id: course.id, platform:plat, title, duration:dur,
        credits:creds, deadline: deadline||null,
        assigned: true, assigned_to: assignTo, created_by: S.user.email
      });
    }
  } else {
    course.assigned    = true;
    course.assigned_to = assignTo;
    course.platform    = plat;
    course.title       = title;
    course.duration    = dur;
    course.credits     = creds;
    course.deadline    = deadline;
    if(SB_READY){
      await sb.update('courses', {
        platform:plat, title, duration:dur, credits:creds,
        deadline: deadline||null, assigned:true, assigned_to:assignTo
      }, `id=eq.${course.id}`);
    }
  }
  showToast(`"${title}" saved & assigned!`, 'success');
  closeM();
}

async function unassignCourse(id){
  const c = S.courses.find(x=>x.id===id);
  if(!c) return;
  c.assigned = false;
  if(SB_READY) await sb.update('courses', {assigned:false}, `id=eq.${id}`);
  showToast(`"${c.title}" unassigned`,'info'); render();
}

async function quickAssign(id){
  const c = S.courses.find(x=>x.id===id);
  if(!c) return;
  c.assigned = true; c.assigned_to = 'all';
  if(SB_READY) await sb.update('courses', {assigned:true, assigned_to:'all'}, `id=eq.${id}`);
  showToast(`"${c.title}" assigned to all students`,'success'); render();
}

async function submitAdd(){
  const name = document.getElementById('nN').value.trim();
  const roll = document.getElementById('nR').value.trim();
  if(!name || !roll){ showToast('Full name and roll number required','error'); return; }
  const stu = {
    name, rollno:roll,
    year:  document.getElementById('nY').value,
    div:   document.getElementById('nD').value,
    email: document.getElementById('nE').value.trim(),
    enrolment: document.getElementById('nEN').value.trim(),
    certs: 0, progress: 0
  };
  S.stus.push(stu);
  if(SB_READY) await sb.upsert('students', stu);
  showToast(`${name} added!`, 'success'); closeM();
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeM(); if(S.chatOpen){ S.chatOpen=false; render(); } }
});

render();
</script>
